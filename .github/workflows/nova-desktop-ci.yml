name: NOVA desktop CI

# Runs typecheck + unit tests for the NOVA desktop app on any change under
# nova-desktop/. Scoped by path so the rest of the GitHub Pages site is
# unaffected. The Electron binary isn't needed for typecheck/tests, so its
# download is skipped to keep CI fast and reliable.

on:
  push:
    paths:
      - 'nova-desktop/**'
      - '.github/workflows/nova-desktop-ci.yml'
  pull_request:
    paths:
      - 'nova-desktop/**'
      - '.github/workflows/nova-desktop-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nova-desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nova-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
