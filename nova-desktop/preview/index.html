  /* Deliberately single dark theme: the orb is a dark-ground graphic and is
     meant to float on black. Tokens still centralise the palette. */
  :root {
    --ground: #050308;
    --ground-2: #0a0713;
    --panel: rgba(16, 11, 30, 0.72);
    --panel-solid: #100b1e;
    --border: rgba(138, 79, 255, 0.22);
    --border-strong: rgba(138, 79, 255, 0.45);
    --teal: #2de1c2;
    --violet: #8a4fff;
    --glow: #b58cff;
    --ink: #ece8ff;
    --ink-dim: #9a90bf;
    --ink-faint: #6a5f8a;
    --mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Menlo, monospace;
    --sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background:
      radial-gradient(120% 90% at 50% 8%, #120826 0%, var(--ground-2) 40%, var(--ground) 100%);
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
  }

  .app {
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100%;
  }

  /* --- Masthead --- */
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 24px 6px;
    flex-wrap: wrap;
  }
  .brand {
    font-family: 'Orbitron', var(--sans);
    font-weight: 700;
    letter-spacing: 0.34em;
    font-size: 13px;
    color: var(--ink);
    text-transform: uppercase;
  }
  .brand b {
    background: linear-gradient(135deg, var(--teal), var(--violet));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 900;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  /* --- Stage --- */
  .stage {
    position: relative;
    display: grid;
    place-items: center;
    min-height: 0;
  }
  .orb {
    position: relative;
    display: grid;
    place-items: center;
    will-change: transform;
  }
  canvas { display: block; }
  .wordmark {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
  }
  .wordmark span {
    grid-area: 1 / 1;
    font-family: 'Orbitron', var(--sans);
    font-weight: 700;
    letter-spacing: 0.15em;
    line-height: 1;
    font-size: clamp(2.1rem, 8vmin, 3.6rem);
  }
  .wm-fill {
    background-image: linear-gradient(135deg, var(--teal), var(--violet));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.6));
    position: relative;
    z-index: 2;
  }
  .wm-glow {
    color: #fff;
    z-index: 1;
  }

  .hint {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--ink-faint);
    text-transform: uppercase;
    text-align: center;
    transition: opacity 0.4s;
    padding: 0 16px;
  }

  /* --- Console --- */
  .console {
    margin: 0 16px 16px;
    padding: 16px 18px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    display: grid;
    grid-template-columns: minmax(200px, 260px) 1fr;
    gap: 20px 28px;
    box-shadow: 0 12px 50px rgba(70, 30, 150, 0.22);
  }
  @media (max-width: 720px) {
    .console { grid-template-columns: 1fr; gap: 16px; }
  }

  .group-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 10px;
  }

  /* Instruments (left) */
  .instruments { display: flex; flex-direction: column; gap: 14px; }
  .readout {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .readout .k {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .state-chip {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    color: var(--glow);
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .state-chip::before {
    content: '';
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--glow);
    box-shadow: 0 0 8px var(--glow);
  }
  .meter {
    height: 8px;
    border-radius: 999px;
    background: rgba(255,255,255,0.06);
    overflow: hidden;
  }
  .meter > i {
    display: block;
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--teal), var(--violet));
    box-shadow: 0 0 10px rgba(138,79,255,0.6);
    transition: width 0.05s linear;
  }
  .src-note {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    line-height: 1.5;
    color: var(--ink-faint);
    min-height: 1.4em;
  }
  .src-note.warn { color: #ffb27a; }
  .src-note.live { color: var(--teal); }

  /* Controls (right) */
  .controls { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  button.act {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 14px;
    cursor: pointer;
    transition: border-color 0.18s, background 0.18s, color 0.18s;
  }
  button.act:hover { border-color: var(--border-strong); background: rgba(255,255,255,0.09); }
  button.act:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  button.act.primary {
    background: linear-gradient(135deg, rgba(45,225,194,0.22), rgba(138,79,255,0.28));
    border-color: var(--border-strong);
    color: #fff;
  }
  button.act[aria-pressed="true"] {
    background: linear-gradient(135deg, rgba(45,225,194,0.28), rgba(138,79,255,0.34));
    border-color: var(--teal);
    color: #fff;
  }

  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: capitalize;
    color: var(--ink-dim);
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .pill:hover { color: var(--ink); border-color: var(--border-strong); }
  .pill:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .pill[aria-pressed="true"] {
    color: #05121a;
    background: linear-gradient(135deg, var(--teal), #6fe9d3);
    border-color: transparent;
    font-weight: 600;
  }

  .sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
  @media (max-width: 480px) { .sliders { grid-template-columns: 1fr; } }
  .slider label {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 5px;
  }
  .slider label b { color: var(--glow); font-weight: 500; font-variant-numeric: tabular-nums; }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; border-radius: 999px;
    background: rgba(255,255,255,0.12);
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 0 8px rgba(45,225,194,0.7);
    cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 15px; height: 15px; border: none; border-radius: 50%;
    background: var(--teal); box-shadow: 0 0 8px rgba(45,225,194,0.7); cursor: pointer;
  }
  select {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink);
    background: var(--panel-solid);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 8px 10px;
    cursor: pointer;
  }
  select:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  .field-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    display: block;
    margin-bottom: 6px;
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">NO<b>VA</b> · ORB PREVIEW</div>
    <div class="eyebrow">Web Audio · Canvas 2D · voice-reactive HUD</div>
  </header>

  <main class="stage">
    <div class="orb" id="orb">
      <canvas id="ring" aria-hidden="true"></canvas>
      <div class="wordmark" aria-label="NOVA">
        <span class="wm-glow" id="wmGlow">NOVA</span>
        <span class="wm-fill">NOVA</span>
      </div>
    </div>
    <div class="hint" id="hint">Enable the microphone, or play the demo voice, to see the ring react</div>
  </main>

  <section class="console" aria-label="Controls">
    <div class="instruments">
      <p class="group-label">Instruments</p>
      <div class="readout">
        <span class="k">State</span>
        <span class="state-chip" id="stateChip">idle</span>
      </div>
      <div>
        <div class="readout"><span class="k">Input level</span><span class="k" id="lvlNum" style="color:var(--glow);font-variant-numeric:tabular-nums">0.00</span></div>
        <div class="meter"><i id="meterFill"></i></div>
      </div>
      <div class="src-note" id="srcNote">Source: none — idle ambient pulse only.</div>
    </div>

    <div class="controls">
      <div>
        <p class="group-label">Audio source</p>
        <div class="row">
          <button class="act primary" id="micBtn" aria-pressed="false">Enable microphone</button>
          <button class="act" id="demoBtn" aria-pressed="false">Play demo voice</button>
        </div>
      </div>

      <div>
        <p class="group-label">State machine</p>
        <div class="pills" id="pills" role="group" aria-label="Assistant state">
          <button class="pill" data-state="idle" aria-pressed="true">idle</button>
          <button class="pill" data-state="listening" aria-pressed="false">listening</button>
          <button class="pill" data-state="speaking" aria-pressed="false">speaking</button>
          <button class="pill" data-state="thinking" aria-pressed="false">thinking</button>
          <button class="pill" data-state="responding" aria-pressed="false">responding</button>
        </div>
      </div>

      <div class="row" style="align-items:flex-end;gap:24px">
        <div>
          <span class="field-label">Theme</span>
          <select id="themeSel">
            <option value="novaDefault">NOVA Default</option>
            <option value="emberForge">Ember Forge</option>
            <option value="arcticPulse">Arctic Pulse</option>
          </select>
        </div>
        <div class="sliders" style="flex:1;min-width:220px">
          <div class="slider">
            <label>Pulse sens. <b id="pulseVal">0.60</b></label>
            <input type="range" id="pulse" min="0" max="1" step="0.05" value="0.6">
          </div>
          <div class="slider">
            <label>Glow sens. <b id="glowVal">0.80</b></label>
            <input type="range" id="glow" min="0" max="1" step="0.05" value="0.8">
          </div>
          <div class="slider">
            <label>Smoothing <b id="smoothVal">0.15</b></label>
            <input type="range" id="smooth" min="0.02" max="0.5" step="0.01" value="0.15">
          </div>
          <div class="slider">
            <label>Orb size <b id="sizeVal">auto</b></label>
            <input type="range" id="size" min="280" max="560" step="10" value="440">
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
  'use strict';
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- Config (mirrors personality.config.ts) ----
  const cfg = {
    baseRotationSpeed: 20,
    activeRotationMultiplier: 1.4,
    thinkingRotationMultiplier: 2.2,
    pulseSensitivity: 0.6,
    glowSensitivity: 0.8,
    idlePulseSpeed: 4,
    smoothingFactor: 0.15,
    peakThreshold: 0.35
  };

  // ---- Themes (mirrors themes.ts) ----
  const themes = {
    novaDefault: { coolEdge:'#2DE1C2', warmEdge:'#8A4FFF', deepShadow:'#120826', glowCore:'#FFFFFF', glowEdge:'#B58CFF', particle:'#FFFFFF' },
    emberForge:  { coolEdge:'#FFB347', warmEdge:'#FF3D6E', deepShadow:'#260812', glowCore:'#FFFFFF', glowEdge:'#FFB199', particle:'#FFE9D6' },
    arcticPulse: { coolEdge:'#7FE7FF', warmEdge:'#3A6BFF', deepShadow:'#04122B', glowCore:'#FFFFFF', glowEdge:'#9FD8FF', particle:'#EAF6FF' }
  };
  let theme = themes.novaDefault;

  // ---- App state ----
  let assistantState = 'idle';
  let source = 'none';            // 'none' | 'mic' | 'demo'
  let manualOverride = true;      // user picked a state explicitly → don't auto-transition off it
  const audio = { rms:0, rawRms:0, peak:false, bands:{low:0,mid:0,high:0} };

  // ---- Helpers ----
  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
  function withAlpha(hex, a) {
    const h = hex.replace('#','');
    const r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
    return 'rgba('+r+','+g+','+b+','+clamp(a,0,1)+')';
  }

  // ---- Signal processor (EMA smoothing + syllable onset), mirrors analyser.ts ----
  const proc = { ema:0, cooldown:0 };
  function processRaw(rawRms, bands) {
    const a = cfg.smoothingFactor;
    proc.ema = a*rawRms + (1-a)*proc.ema;
    let peak = false;
    if (proc.cooldown > 0) proc.cooldown--;
    const overshoot = rawRms - proc.ema;
    if (proc.cooldown === 0 && proc.ema > 0.04 && overshoot > cfg.peakThreshold*proc.ema) {
      peak = true; proc.cooldown = 6;
    }
    audio.rms = proc.ema; audio.rawRms = rawRms; audio.peak = peak; audio.bands = bands;
  }

  // ---- Mic driver ----
  const mic = { ctx:null, analyser:null, stream:null, freq:null, time:null };
  async function startMic() {
    mic.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:true, noiseSuppression:true, autoGainControl:false } });
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0.6;
    ctx.createMediaStreamSource(mic.stream).connect(analyser);
    mic.ctx = ctx; mic.analyser = analyser;
    mic.freq = new Uint8Array(analyser.frequencyBinCount);
    mic.time = new Uint8Array(analyser.fftSize);
  }
  function stopMic() {
    if (mic.stream) mic.stream.getTracks().forEach(t => t.stop());
    if (mic.ctx) mic.ctx.close();
    mic.ctx = mic.analyser = mic.stream = null;
  }
  function sampleMic() {
    const an = mic.analyser;
    an.getByteFrequencyData(mic.freq);
    an.getByteTimeDomainData(mic.time);
    let sum = 0;
    for (let i=0;i<mic.time.length;i++){ const c=(mic.time[i]-128)/128; sum += c*c; }
    const rawRms = Math.min(1, Math.sqrt(sum/mic.time.length)*3);
    const n = mic.freq.length, lowEnd=Math.floor(n*0.1), midEnd=Math.floor(n*0.4);
    const avg=(f,t)=>{ let s=0; for(let i=f;i<t;i++) s+=mic.freq[i]; return s/Math.max(1,t-f)/255; };
    return { rawRms, bands:{ low:avg(0,lowEnd), mid:avg(lowEnd,midEnd), high:avg(midEnd,n) } };
  }

  // ---- Demo driver: synthetic speech-like envelope ----
  const demo = { t:0, nextSyl:0, sylEnv:0 };
  function sampleDemo(dt) {
    demo.t += dt;
    // Phrase rhythm: bursts of syllables with pauses.
    demo.nextSyl -= dt;
    if (demo.nextSyl <= 0) {
      demo.sylEnv = 0.5 + Math.random()*0.5;
      demo.nextSyl = 0.12 + Math.random()*0.22;         // syllable spacing
      if (Math.random() < 0.18) demo.nextSyl += 0.5 + Math.random()*0.7; // breath/pause
    }
    demo.sylEnv *= Math.pow(0.001, dt);                 // fast decay between syllables
    const carrier = 0.5 + 0.5*Math.sin(demo.t*2.2);
    const rawRms = clamp(demo.sylEnv * (0.55 + 0.45*carrier), 0, 1);
    return { rawRms, bands:{ low:rawRms*0.7, mid:rawRms, high:rawRms*0.5 } };
  }

  // ---- Animation math (mirrors glow.ts / rotation.ts) ----
  const STATE_BASE_OPACITY = { idle:0.4, listening:0.5, speaking:0.7, thinking:0.65, responding:0.7 };
  function computeGlow(t) {
    const base = STATE_BASE_OPACITY[assistantState];
    const idlePulse = 0.5 + 0.5*Math.sin((t/cfg.idlePulseSpeed)*Math.PI*2);
    let intensity;
    switch (assistantState) {
      case 'idle': intensity = 0.15 + idlePulse*0.2; break;
      case 'listening': intensity = 0.25 + idlePulse*0.1 + audio.rms*0.2; break;
      case 'thinking': { const s=0.5+0.5*Math.sin((t/1.2)*Math.PI*2); intensity=0.4+s*0.35; break; }
      case 'responding': { const f=0.5+0.5*Math.sin((t/0.9)*Math.PI*2); intensity=0.5+f*0.4; break; }
      default: intensity = Math.min(1, 0.3 + audio.rms*cfg.glowSensitivity*2.2);
    }
    const blur = 12 + intensity*48;
    const opacity = Math.min(1, base + intensity*0.5);
    return { intensity, blur, opacity };
  }
  function targetScale() {
    if (assistantState === 'idle') return 1;
    const swell = audio.rms*cfg.pulseSensitivity*0.05;
    const kick = audio.peak ? 0.08*cfg.pulseSensitivity + 0.02 : 0;
    return 1 + swell + kick;
  }
  function rotationSpeed() {
    const baseD = reduceMotion ? 0 : 360/cfg.baseRotationSpeed;
    switch (assistantState) {
      case 'thinking': return baseD*cfg.thinkingRotationMultiplier;
      case 'responding': return baseD*1.6;
      case 'speaking': return baseD*(1 + (cfg.activeRotationMultiplier-1)*Math.min(1,audio.rms*2));
      case 'listening': return baseD*1.05;
      default: return baseD;
    }
  }

  // ---- Particles ----
  function makeParticles() {
    const arr = [];
    for (let i=0;i<220;i++){
      const near = Math.random()<0.6;
      arr.push({
        angle: Math.random()*Math.PI*2,
        radius: near ? 0.85+Math.random()*0.35 : 0.3+Math.random()*1.1,
        size: 0.5+Math.random()*1.8,
        baseAlpha: 0.1+Math.random()*0.7,
        twinkle: Math.random()*Math.PI*2,
        drift: (Math.random()-0.5)*0.0008
      });
    }
    return arr;
  }
  let particles = makeParticles();

  // ---- Canvas / render ----
  const canvas = document.getElementById('ring');
  const ctx = canvas.getContext('2d');
  const orbEl = document.getElementById('orb');
  const wmGlow = document.getElementById('wmGlow');
  let size = 440, dpr = 1, angle = 0;
  let userSize = null;

  function layout() {
    const stage = document.querySelector('.stage');
    const avail = Math.min(stage.clientWidth, stage.clientHeight) - 40;
    size = clamp(userSize || Math.min(520, avail), 240, avail);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = size*dpr; canvas.height = size*dpr;
    canvas.style.width = size+'px'; canvas.style.height = size+'px';
    orbEl.style.width = size+'px'; orbEl.style.height = size+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function drawParticles(cx, cy, R, glow, elapsed) {
    for (const p of particles) {
      p.angle += p.drift + (reduceMotion?0:0.0004);
      const tw = 0.5 + 0.5*Math.sin(elapsed*2 + p.twinkle);
      const alpha = p.baseAlpha*(0.4+tw*0.6)*(0.5+glow.opacity*0.7);
      const r = R*p.radius;
      const x = cx+Math.cos(p.angle)*r, y = cy+Math.sin(p.angle)*r;
      const s = p.size*(1+audio.rms*0.8);
      ctx.beginPath(); ctx.arc(x,y,s,0,Math.PI*2);
      ctx.fillStyle = withAlpha(theme.particle, Math.min(0.8,alpha)); ctx.fill();
    }
  }
  function drawFlares(cx, cy, R, glow) {
    const streaks = [
      { y:-R*0.15, len:size*0.42, w:1.4, a:0.5 },
      { y:R*0.05, len:size*0.36, w:1.0, a:0.35 },
      { y:R*0.28, len:size*0.24, w:0.8, a:0.25 }
    ];
    for (const s of streaks) {
      const y = cy+s.y, x0 = cx+R*0.6, x1 = x0+s.len*(0.7+glow.intensity*0.6);
      const g = ctx.createLinearGradient(x0,y,x1,y);
      g.addColorStop(0, withAlpha(theme.glowCore, s.a*glow.opacity));
      g.addColorStop(0.5, withAlpha(theme.coolEdge, s.a*0.6*glow.opacity));
      g.addColorStop(1, withAlpha(theme.warmEdge, 0));
      ctx.strokeStyle = g; ctx.lineWidth = s.w;
      ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke();
    }
  }
  function drawRing(cx, cy, R, glow, ang, elapsed) {
    ctx.shadowBlur = glow.blur; ctx.shadowColor = withAlpha(theme.glowEdge, glow.opacity);
    for (let strand=0; strand<3; strand++) {
      const phase = (strand/3)*Math.PI*2;
      ctx.lineWidth = Math.max(1, 3.5-strand*0.8); ctx.lineCap='round';
      ctx.beginPath();
      for (let i=0;i<=160;i++){
        const t = i/160, th = t*Math.PI*2 + ang;
        const wobble = Math.sin(th*6+phase+elapsed*1.3)*0.02 + Math.sin(th*11-elapsed*0.7)*0.012
          + Math.sin(th*3+phase)*0.03 + (audio.bands.high+audio.bands.mid)*0.02*Math.sin(th*9+elapsed*3);
        const r = R*(1+wobble)*(1+audio.rms*0.03);
        const x = cx+Math.cos(th)*r, y = cy+Math.sin(th)*r;
        i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      const g = ctx.createLinearGradient(cx-R,cy-R,cx+R,cy+R);
      g.addColorStop(0, withAlpha(theme.coolEdge, glow.opacity));
      g.addColorStop(0.45, withAlpha(theme.coolEdge, glow.opacity*0.9));
      g.addColorStop(0.55, withAlpha(theme.warmEdge, glow.opacity*0.9));
      g.addColorStop(1, withAlpha(theme.warmEdge, glow.opacity));
      ctx.strokeStyle = g; ctx.stroke();
    }
    ctx.shadowBlur = 0; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx,cy,R*0.9,0,Math.PI*2);
    ctx.strokeStyle = withAlpha(theme.deepShadow, 0.6); ctx.stroke();
  }
  function drawShimmer(cx, cy, R, glow, elapsed) {
    const spokes = 24;
    const flow = assistantState==='responding' ? (elapsed*2)%(Math.PI*2) : 0;
    for (let i=0;i<spokes;i++){
      const th = (i/spokes)*Math.PI*2 + elapsed*0.2;
      const pulse = 0.5+0.5*Math.sin(elapsed*3+i);
      let alpha = 0.06 + pulse*0.06*glow.intensity;
      if (assistantState==='responding'){
        const d = Math.abs(((th-flow+Math.PI)%(Math.PI*2))-Math.PI);
        if (d<0.5) alpha += (0.5-d)*0.5;
      }
      const ri=R*0.2, ro=R*(0.55+pulse*0.2);
      ctx.strokeStyle = withAlpha(i%2===0?theme.coolEdge:theme.warmEdge, alpha);
      ctx.lineWidth=0.8;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(th)*ri, cy+Math.sin(th)*ri);
      ctx.lineTo(cx+Math.cos(th)*ro, cy+Math.sin(th)*ro);
      ctx.stroke();
    }
  }

  // ---- Pulse spring ----
  let sc = 1, scv = 0;
  function stepSpring(target, dt) {
    const k = 220, damp = 18, m = 0.6;
    const a = (k*(target-sc) - damp*scv)/m;
    scv += a*dt; sc += scv*dt;
    return sc;
  }

  // ---- Main loop ----
  let last = performance.now(), start = performance.now();
  let uiAccum = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now-last)/1000); last = now;
    const elapsed = (now-start)/1000;

    // Acquire audio
    if (source === 'mic' && mic.analyser) { const s = sampleMic(); processRaw(s.rawRms, s.bands); }
    else if (source === 'demo') { const s = sampleDemo(dt); processRaw(s.rawRms, s.bands); }
    else { processRaw(0, {low:0,mid:0,high:0}); }

    // Voice-activity → state, unless user overrode to thinking/responding or picked a manual state this frame
    if (source !== 'none' && assistantState !== 'thinking' && assistantState !== 'responding') {
      if (audio.rawRms > 0.08) { if (assistantState !== 'speaking'){ setState('speaking', false); } silence = 0; }
      else { silence++; if (silence > 30 && assistantState === 'speaking') setState('listening', false); }
    }

    angle = (angle + rotationSpeed()*dt) % 360;
    const glow = computeGlow(elapsed);

    // Render ring
    const cx = size/2, cy = size/2, R = size*0.32;
    ctx.clearRect(0,0,size,size);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawParticles(cx,cy,R,glow,elapsed);
    drawFlares(cx,cy,R,glow);
    drawRing(cx,cy,R,glow,(angle*Math.PI/180),elapsed);
    drawShimmer(cx,cy,R,glow,elapsed);
    ctx.restore();

    // Pulse
    const s = stepSpring(targetScale(), dt);
    orbEl.style.transform = 'scale('+s.toFixed(4)+')';

    // Wordmark glow
    const gpx = 8 + glow.intensity*40;
    const gop = 0.35 + glow.intensity*0.6;
    wmGlow.style.filter = 'blur('+(gpx*0.35)+'px)';
    wmGlow.style.opacity = gop.toFixed(3);
    wmGlow.style.textShadow = '0 0 '+gpx+'px '+theme.glowCore+', 0 0 '+(gpx*2)+'px '+theme.glowEdge;

    // Instruments (throttled ~15fps)
    uiAccum += dt;
    if (uiAccum > 0.066) { uiAccum = 0; updateInstruments(); }

    requestAnimationFrame(frame);
  }
  let silence = 0;

  function updateInstruments() {
    meterFill.style.width = (audio.rms*100).toFixed(1)+'%';
    lvlNum.textContent = audio.rms.toFixed(2);
  }

  // ---- UI wiring ----
  const micBtn = document.getElementById('micBtn');
  const demoBtn = document.getElementById('demoBtn');
  const pills = document.getElementById('pills');
  const stateChip = document.getElementById('stateChip');
  const srcNote = document.getElementById('srcNote');
  const hint = document.getElementById('hint');
  const meterFill = document.getElementById('meterFill');
  const lvlNum = document.getElementById('lvlNum');

  function setState(s, manual) {
    assistantState = s;
    if (manual !== undefined) manualOverride = manual;
    stateChip.textContent = s;
    [...pills.children].forEach(p => p.setAttribute('aria-pressed', String(p.dataset.state === s)));
  }
  function setSourceNote() {
    srcNote.className = 'src-note';
    if (source === 'mic') { srcNote.textContent = 'Source: microphone — speak to drive the ring.'; srcNote.classList.add('live'); }
    else if (source === 'demo') { srcNote.textContent = 'Source: demo voice — synthetic speech envelope.'; }
    else { srcNote.textContent = 'Source: none — idle ambient pulse only.'; }
    hint.style.opacity = source === 'none' ? '1' : '0';
  }

  micBtn.addEventListener('click', async () => {
    if (source === 'mic') { stopMic(); source='none'; micBtn.setAttribute('aria-pressed','false'); micBtn.textContent='Enable microphone'; setState('idle', true); setSourceNote(); return; }
    try {
      await startMic();
      if (source === 'demo') { source='none'; demoBtn.setAttribute('aria-pressed','false'); }
      source = 'mic';
      micBtn.setAttribute('aria-pressed','true'); micBtn.textContent='Stop microphone';
      setState('listening', false); setSourceNote();
    } catch (err) {
      source='none';
      srcNote.className='src-note warn';
      srcNote.textContent = 'Microphone blocked in this preview frame. Use “Play demo voice” to see the reaction.';
      hint.style.opacity='0';
    }
  });

  demoBtn.addEventListener('click', () => {
    if (source === 'demo') { source='none'; demoBtn.setAttribute('aria-pressed','false'); setState('idle', true); setSourceNote(); return; }
    if (source === 'mic') { stopMic(); micBtn.setAttribute('aria-pressed','false'); micBtn.textContent='Enable microphone'; }
    source='demo'; demoBtn.setAttribute('aria-pressed','true');
    setState('listening', false); setSourceNote();
  });

  pills.addEventListener('click', (e) => {
    const btn = e.target.closest('.pill'); if (!btn) return;
    setState(btn.dataset.state, true);
  });

  document.getElementById('themeSel').addEventListener('change', (e) => { theme = themes[e.target.value] || themes.novaDefault; });

  const bind = (id, valId, fmt, apply) => {
    const el = document.getElementById(id), out = document.getElementById(valId);
    el.addEventListener('input', () => { const v = parseFloat(el.value); apply(v); out.textContent = fmt(v); });
  };
  bind('pulse','pulseVal', v=>v.toFixed(2), v=>cfg.pulseSensitivity=v);
  bind('glow','glowVal', v=>v.toFixed(2), v=>cfg.glowSensitivity=v);
  bind('smooth','smoothVal', v=>v.toFixed(2), v=>cfg.smoothingFactor=v);
  bind('size','sizeVal', v=>v+'px', v=>{ userSize=v; layout(); });

  window.addEventListener('resize', layout);
  layout();
  setSourceNote();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
